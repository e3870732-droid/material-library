function scriptBody(s){return `<div class="body-copy"><p>${s.bodyIntro}</p><p>就比如说现在很多家长，因为网上各种数学英语的广告满天飞，然后就过分地偏重于数学和英语，导致学前，对语文基本功的重视不够。那上了小学识字量连 500 个都没有，结果一到 1 年级，课上听不懂，课下学不会。直接起步落后同学一大截；</p><p>那还有些家长，还停留在自己的认知经验里。想着英语我二三十年前也学过，我初一才开始学，我照样高考 140 多分，我根本不用搞。然后就错过了语言黄金期，后面醒悟过来了，发现是过程痛苦效果又差。而且这个时候其他学科的压力也上来了，就更手忙脚乱。</p><p>所以这就是为什么过去三年，我们规划营近10 万家长上完课以后，说的最多的四个字，就叫做相见恨晚。因为我们是第一次用简单的一张图，就给你把孩子从0 到 18 岁每一个阶段，语数英加上兴趣班，什么时间该做什么，94个关键点，84个避坑点，做了完整，系统的梳理。</p><p>担心大家看不懂，我还准备了三天的教育规划精华课，把这些节奏、关键点、避坑点的底层逻辑，一次性给你讲清楚，就三个晚上，咱们就安安心心的来听一听，把教育的基本认知拉到位，听完你就会发现，那些碎片的，割韭菜的信息，再也骗不到你了，赶紧点进来直播间听一听。</p></div>`}
function contentTree(s){const opening='想不想不用自己鸡，孩子就能自己卷，不用砸钱，孩子就能稳上重本？我作为一个高考省状元，xxx。我可以非常负责任的说，想要达到这个效果真的不难。尤其是今天这样一个时代——';const titles=['被保送北大的省状元：别再花冤枉钱搞鸡娃','学习学的痛苦还是开心？取决于家长的认知'];return `<section class="script-block"><div class="script-block-head"><h4>脚本内容</h4></div><div class="content-tree"><article class="content-title-group"><div class="content-title-head"><div class="content-title-name"><b>标题 1</b><span>${titles[0]}</span></div></div><div class="content-branch"><div class="content-opening"><div class="content-opening-label"><b>开头 1</b></div><p>${opening}</p></div><details class="content-body" open><summary><b>正文 1</b></summary>${scriptBody(s)}</details></div></article><article class="content-title-group"><div class="content-title-head"><div class="content-title-name"><b>标题 2</b><span>${titles[1]}</span></div></div><div class="content-branch"><details class="shared-reference"><summary><span><b>开头 1</b><i>与标题 1 共用</i></span><em>展开</em></summary><div class="shared-preview"><small>以下内容来自标题 1 · 开头 1</small><p>${opening}</p></div></details><details class="shared-reference"><summary><span><b>正文 1</b><i>与标题 1 共用</i></span><em>展开</em></summary><div class="shared-preview"><small>以下内容来自标题 1 · 正文 1</small>${scriptBody(s)}</div></details></div></article></div></section>`}
function scriptDetail(s){return `<div class="section-title"><div><h2>脚本 ${s.id}</h2><span class="readonly">来源文档编号 ${s.sourceNo}</span></div><div>${can('editScript')?`<button class="btn ghost" data-script-edit="${s.id}">修改脚本</button><button class="btn danger" data-script-delete="${s.id}">删除脚本</button>`:''}${can('downloadScript')?`<button class="btn ghost" data-download="脚本 ${s.id}">⇩ 下载脚本</button>`:'<span class="readonly">当前角色不可下载脚本</span>'}</div></div><article class="script"><div class="script-head"><div><h3>${s.name}</h3><div class="script-name-hint">${s.fullName} · ${state.role==='organizer'?'前期整理中可调整':'素材库内只读'}</div></div><div class="tags">${tag('原始脚本')}${tag('标题 2')}${tag('内容组合 2')}${tag('正文 1')}</div></div><div class="script-profile">${[['场景',s.scene],['设备',s.device],['机位',s.position],['服装',s.clothing],['道具',s.prop],['动作',s.action]].map(([k,v])=>`<div class="profile-item"><b>${k}</b><span>${v}</span></div>`).join('')}</div><div class="media-relation"><span><b>本机镜号</b>${s.shot}</span><span><b>使用音轨来源</b>${s.audio}</span></div>${contentTree(s)}</article>`}

let dialogReturnFocus=null,dialogBodyOverflow='';
function openDrawer(title,body,foot){
 const dialog=$('#drawer');
 if(!dialog.classList.contains('open')){dialogReturnFocus=document.activeElement;dialogBodyOverflow=document.body.style.overflow}
 closeFilterMenus();
 $('#drawerTitle').textContent=title;$('#drawerBody').innerHTML=body;$('#drawerFoot').innerHTML=foot;
 dialog.inert=false;dialog.setAttribute('aria-hidden','false');dialog.classList.add('open');$('#mask').classList.add('open');
 document.body.style.overflow='hidden';$('#drawerBody').scrollTop=0;$('#close').focus();
}
function closeDrawer(){
 const dialog=$('#drawer');if(!dialog.classList.contains('open'))return;
 dialog.classList.remove('open');$('#mask').classList.remove('open');dialog.inert=true;dialog.setAttribute('aria-hidden','true');
 document.body.style.overflow=dialogBodyOverflow;if(dialogReturnFocus?.isConnected)dialogReturnFocus.focus();
}
document.addEventListener('keydown',e=>{
 const dialog=$('#drawer');if(e.key!=='Tab'||!dialog.classList.contains('open'))return;
 const items=[...dialog.querySelectorAll('button,input,select,textarea,a[href],[tabindex]')].filter(x=>!x.disabled&&x.tabIndex>=0&&x.getClientRects().length);
 const first=items[0],last=items[items.length-1];
 if(!first){e.preventDefault();dialog.focus()}
 else if(e.shiftKey&&(document.activeElement===first||!dialog.contains(document.activeElement))){e.preventDefault();last.focus()}
 else if(!e.shiftKey&&(document.activeElement===last||!dialog.contains(document.activeElement))){e.preventDefault();first.focus()}
});
